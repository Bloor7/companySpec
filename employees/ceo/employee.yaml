# CEO — người điều phối, và từ 2026-09-20 là một EMPLOYEE CÓ KHAI BÁO.
#
# ═══════════════════════════════════════════════════════════════════════
# VÌ SAO HỒ SƠ NÀY TỒN TẠI
# ═══════════════════════════════════════════════════════════════════════
#
# Đo 2026-09-20: trong 6.146 lời gọi THẬT của bảy ngày, đúng **6 lời gọi**
# mang `employeeId` — 0,1%. Tầng Employee đã dựng, đã kiểm, và gần như không
# nằm trên đường chạy: CEO gọi thẳng dispatcher với quyền NGẦM ĐỊNH vô hạn.
#
# Nghĩa là hệ có hai hình: hình trên giấy (Task → Employee → Brain → Policy)
# và hình đang chạy (CEO → Policy). Và chỉ hình thứ hai mới đúng.
#
# Khai CEO thành một employee là **thắt lại**, không phải nới: trước đây nó
# không bị `mayDo()` soát lần nào. Từ nay mỗi lời gọi phải lọt qua đúng cánh
# cửa mà `sage` và `forge` vẫn phải lọt.
#
# ═══════════════════════════════════════════════════════════════════════
# QUYỀN Ở ĐÂY ĐO RA, KHÔNG NGHĨ RA
# ═══════════════════════════════════════════════════════════════════════
#
# Danh sách dưới đây là HỢP của `Capability.touches` trên TOÀN BỘ danh mục
# mà CEO được phép gọi (`canBeCalledBy: [ceo]`), không phải trên lưu lượng
# ba mươi ngày. Hai cách cho hai kết quả khác nhau, và khác đúng ở chỗ nguy
# hiểm nhất: lưu lượng nói thứ HAY DÙNG, manifest nói thứ CÓ THỂ dùng — mà
# "ít dùng" trong hệ này thường đồng nghĩa với "nặng" (xoá khoản chi, đăng
# bài công khai).
#
# Khai theo lưu lượng là để dành một lần gãy cho cái ngày admin nhờ làm đúng
# việc hiếm ấy.
#
# Tính lại khi thêm company: `python3 gateway/cli/travis.py employees`, và ca
# thử `testCeoCanStillCallEverything` đối chiếu tự động mỗi lần chạy.

employeeId: ceo
role: coordinator
displayName: "CEO — điều phối"

personality:
  # Hỏi lại admin còn rẻ hơn làm sai một việc có tác động ra ngoài.
  - asksWhenUnsure
  # Nói lại bằng THỨ và NGÀY tuyệt đối, không lặp chữ mơ hồ của admin.
  - confirmsWithAbsoluteDates
  # Không bịa. Không có dữ kiện thì đi tra, hoặc nói là chưa tra.
  - citesWhatItLookedUp

expertise:
  - orchestration
  - conversation

responsibilities:
  - "Hiểu ý admin rồi CHỌN năng lực có thật trong danh mục, không đoán tên."
  - "Tra trước rồi mới ghép — company không gọi company (P3), nên việc ghép
     nguồn là của CEO."
  - "Nói lại hậu quả bằng ngôn ngữ của admin, không bằng tên hàm."
  - "Việc xong mà người cần biết chưa biết thì tính là CHƯA XONG."

# ─────────────────────────────────────────────────────────────────────
# Đúng bảy dòng. Mỗi dòng có ít nhất một năng lực thật đứng sau nó.
# ─────────────────────────────────────────────────────────────────────
permissions:
  # Sổ sách của admin — tiền, lịch, việc, nhật ký, mục tiêu.
  - { resource: database, action: read }
  - { resource: database, action: modify }

  # Tra web và hỏi hội đồng. `browserCompany` đi đường này, và nó là chỗ
  # ranh giới mỏng nhất của cả hệ — đọc đầu companies/browserCompany/ trước
  # khi nới bất cứ thứ gì.
  - { resource: web, action: read }
  # apiCompany.capNhatDanhMuc — làm mới danh mục API.
  - { resource: web, action: modify }

  # panharmonCompany.listPosts, writerCompany.vietBai
  - { resource: repository, action: read }
  # panharmonCompany.taoBaiNhap — bài NHÁP, chưa ai ngoài đọc được.
  - { resource: repository, action: modify }
  # panharmonCompany.dangBai — ĐĂNG CÔNG KHAI.
  #
  # Có mặt ở đây KHÔNG phải là được tự do đăng: nó là `irreversible`, nên
  # Policy chặn whitelist (G9), chặn đường tự chủ, và bắt admin ký từng lần.
  # Quyền này chỉ trả lời câu "CEO có được PHÉP đề nghị việc đó không".
  - { resource: repository, action: publish }

# ─────────────────────────────────────────────────────────────────────
# `cannot` THẮNG `permissions`, luôn luôn (E-2).
#
# Đây là những thứ không lời gọi nào của CEO được chạm tới, kể cả khi ai đó
# thêm một company mới mở đúng cánh cửa ấy. Viết ở đây thì company mới không
# lặng lẽ mở rộng quyền của CEO.
# ─────────────────────────────────────────────────────────────────────
cannot:
  # P4 — secret không bao giờ đi qua tay employee. Cần khoá thì tiến trình
  # con được BƠM vào lúc chạy, và chỉ đúng tên đã khai trong manifest.
  - secret.read
  - production.deploy
  - production.modify
  # Xoá là thứ admin tự làm, hoặc đi qua một năng lực khai rõ — không phải
  # một quyền đứng của người điều phối.
  - repository.delete
  - database.delete
  - filesystem.delete
  # CEO KHÔNG tự gửi tin. Nó trả lời admin qua đường của gateway; một quyền
  # `telegram.send` đứng sẵn là mở đường cho việc nhắn cho người khác.
  - telegram.send

brains:
  preferred: [claude]
  fallback:  [gemini]

# CEO đọc hồ sơ đời tư của admin, số dư từng ví và lịch cá nhân. Đó là mức
# `sensitive`, và `brains/router.py` dùng đúng con số này để quyết định gói
# tin nào được rời khỏi máy — xem `travis.py brains sensitive`.
maxDataClassification: sensitive
