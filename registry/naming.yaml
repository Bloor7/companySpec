  nhacDaGui: reminderSent

# ────────────────────────── tên đã đúng, đã duyệt ──────────────────────────
#
# Những định danh đã là tiếng Anh camelCase đúng luật. Có mặt ở đây nghĩa là
# CÓ NGƯỜI ĐÃ NHÌN và đồng ý, không phải "máy đoán là ổn".
#
# `ops/namingAudit.py --check` đòi MỌI định danh phải hoặc nằm trong bản đồ đổi
# tên ở trên, hoặc nằm trong danh sách này. Thêm trường mới mà quên khai thì
# bộ soát đỏ — đó là chủ ý: đặt tên phải là việc CỐ Ý, không phải tai nạn.
#
# Lấy danh sách cần thêm bằng: python3 ops/namingAudit.py --uncovered
