# naming.yaml — một khái niệm, một tên
#
# NGUỒN CHÂN LÝ cho việc đặt tên. Luật ở docs/NAMING.md; đây là dữ liệu.
#
# VÌ SAO LÀ FILE CHỨ KHÔNG PHẢI CODE: thêm một khái niệm mới là thêm một DÒNG
# ở đây, không phải sửa bộ soát (W3′ — thêm gì cũng không được sửa Core).
#
# HAI CHỖ DỄ SAI, đọc trước khi thêm dòng:
#
#   1. `vi` mang HAI nghĩa trong repo này:
#        walletCompany.vi     = ví   → wallet
#        ngoaiNguCompany.vi   = tiếng Việt → vi (mã ISO 639-1, GIỮ NGUYÊN)
#      Nên mới có mục `perCompany`. Đừng bao giờ thêm một tên mơ hồ vào
#      `global` — cùng một chữ ở hai company có thể là hai thứ khác hẳn.
#
#   2. GIÁ TRỊ enum tiếng Việt thì KHÔNG đổi. `danhMuc: [ăn uống, đi lại…]`
#      là dữ liệu thật đang nằm trên Notion của admin. Đổi tên TRƯỜNG thì được;
#      đổi GIÁ TRỊ là làm hỏng lịch sử và làm chết mọi whitelist khoá vào chúng.

version: 1

# ────────────────────────── năng lực ──────────────────────────
# Luật L3: động từ + tân ngữ. Chỉ liệt kê cái PHẢI đổi; tên đã đúng thì không
# có mặt ở đây.
capabilities:
  apiCompany:
    capNhatDanhMuc: refreshCatalog
    kiemApi: checkApi
    timApi: findApi
    xemApi: getApi

  browserCompany:
    duyetWeb: browseWeb
    kiemTraTrang: checkPage

  expenseCompany:
    suaExpense: updateExpense        # cả company dùng tiếng Anh, trừ đúng cái này

  hoiDongCompany:
    hoiY: askCouncil

  ngoaiNguCompany:
    themCau: addSentence
    xoaCau: deleteSentence
    dsCau: listSentences
    danhDauThuoc: markMemorised

  nhacCompany:
    datNhac: createReminder
    dsNhac: listReminders
    huyNhac: cancelReminder

  panharmonCompany:
    taoBaiNhap: createDraft
    dangBai: publishPost

  writerCompany:
    vietBai: writeArticle

  researchCompany:
    nghienCuu: research

  searchCompany:
    traNhanh: quickAnswer

  xuongCompany:
    themViec: addWorkItem
    nhanViec: claimWorkItem
    ghiBuoc: recordStep
    xongViec: completeWorkItem
    tamDung: pauseWorkItem
    dsViec: listWorkItems
    donDep: cleanupStalled
    nhatKy: listWorkLog

