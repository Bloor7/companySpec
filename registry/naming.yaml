    nhanh: branch

  # Ghi đè theo company. Ưu tiên CAO HƠN `global`.
  perCompany:
    walletCompany:
      vi: wallet                    # "ví" — enum [tiền mặt, tài khoản]

    ngoaiNguCompany:
      vi: vi                        # mã ISO 639-1, L6 giữ nguyên
      en: en
      zh: zh
      py: py                        # pinyin
      enDoc: enPronunciation
      zhDoc: zhPronunciation
      cau: sentence
      cauId: sentenceId

    xuongCompany:
      tiepLuc: resumeToken

# ────────────────────────── bảng SQLite ──────────────────────────
# §7: bảng camelCase số ít, tiếng Anh. Hai bảng dưới đây cần migration dữ liệu
# chứ không phải tìm-và-thay — xem ops/migrateNames.py.
