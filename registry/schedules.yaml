# Việc định kỳ. §12c — cửa vào thứ hai của hệ, hẹp hơn hẳn cửa của admin.
#
# S2 — MỌI lịch phải khai ở đây trước. CEO không được tự đặt lịch (§11 luật 13).
#      Không có mục nào ở đây thì không có việc định kỳ nào chạy.
# S3 — trần rủi ro của cron là `read`. Không lịch nào được ghi.
# S5 — phiên riêng, không bao giờ nối vào luồng hội thoại của admin.
# S6 — cron không đánh thức cron.
#
# Giờ theo múi Asia/Ho_Chi_Minh. Bộ chạy kiểm mỗi 15 phút (systemd timer), nên
# lịch chỉ chính xác tới mức 15 phút — đủ cho báo cáo, không dùng cho việc gấp.

schedules:
  - scheduleId: morningReport
    displayName: "Báo cáo sáng"
    enabled: true
    at: "05:30"                  # mỗi ngày — admin dậy 5h30 mở cửa, đọc luôn lúc đó
    days: [2, 3, 4, 5, 6, 7, 8]  # 2=thứ Hai … 8=Chủ nhật
    kind: digest                 # digest | companyCall
    # Không dùng LLM (RP1) — mọi con số đều tra được bằng code cứng.
    sections: [agenda, quota, activity, approvals, permissions, plan]
    quietIfEmpty: false          # báo cáo sáng thì vẫn gửi dù không có gì lạ

  - scheduleId: todoSang
    displayName: "Việc cần làm"
    enabled: true
    at: "05:30"                  # cùng giờ báo cáo sáng — admin dậy mở cửa, đọc luôn
    days: [2, 3, 4, 5, 6, 7, 8]
    kind: companyCall
    companyId: todoCompany
    capability: listTodos        # read — S3: cron nhắc, KHÔNG tự thêm việc
    input: { trangThai: "chưa xong", gioiHan: 30 }
    # Không có việc nào thì im. listTodos trả summary rỗng đúng lúc đó (S7).
    quietIfEmpty: true

  # BỎ lịch "canh hạn mức" ngày 2026-08-16 (admin quyết).
  #
  # Nó chạy mỗi 2 tiếng để so chi phí với một ngưỡng đoán rồi kêu "sắp chạm
  # trần". Con số đó hệ tự cộng từ bảng giá token, không phải hạn mức thật —
  # `claude -p` không trả về hạn mức còn lại và CLI không có lệnh `usage`.
  # Canh một con số bịa thì cảnh báo cũng bịa.
  #
  # Thay bằng: khi Anthropic THẬT SỰ chặn, gateway bắt được ngay lúc đó và
  # nhắn admin (lib/quotaSignal.py). Không cần ai đi tuần mỗi 2 tiếng.
  # Số đã tiêu vẫn nằm trong báo cáo sáng, ở mục quota, dưới dạng thông tin.

  - scheduleId: calendarWatch
    displayName: "Sắp tới giờ"
    enabled: true
    everyHours: 0.25             # bộ chạy 15 phút/lần, nên đây là "mỗi lần chạy"
    kind: companyCall
    companyId: calendarCompany
    capability: upcomingEvents   # read — cron nhắc, không tự sửa lịch (S3)
    input: { trongPhut: 30, danhDau: true }
    # Không có gì sắp tới thì im. Mỗi sự kiện chỉ nhắc đúng một lần.
    quietIfEmpty: true

  - scheduleId: savingsNudge
    displayName: "Nhắc nạp quỹ"
    enabled: true
    at: "08:00"
    dayOfMonth: 1                # cùng ngày lương về — nhắc lúc còn tiền trong tay
    kind: companyCall
    companyId: savingsCompany
    capability: fundProgress     # read — S3 cho phép; cron chỉ nhắc, không tự nạp
    input: { nhacNap: true }     # báo cáo xong thì hỏi luôn: tháng này nạp bao nhiêu
    # Vẫn gửi dù chưa có quỹ nào: tháng nào cũng thấy thanh tiến độ mới là nhắc.
    quietIfEmpty: false

  - scheduleId: dailyMoney
    displayName: "Tiền cuối ngày"
    enabled: true
    at: "21:00"                   # trước lúc admin đi ngủ, còn kịp điều chỉnh
    days: [2, 3, 4, 5, 6, 7, 8]
    kind: digest                  # digest chứ không phải companyCall: cần ghép
    sections: [tienbac]           # nhiều company lại, việc đó chỉ hạ tầng làm được
    quietIfEmpty: false
    # Không dùng LLM (RP1) — mọi con số đều tra được bằng code cứng, nên báo cáo
    # này chạy mỗi tối mà không tốn một đồng hạn mức nào.

  - scheduleId: hocSang
    displayName: "Học sáng"
    enabled: true
    at: "05:30"                  # admin dậy 5h30 mở cửa — đầu óc sạch nhất ngày
    days: [2, 3, 4, 5, 6, 7, 8]  # mỗi ngày
    kind: digest
    sections: [hocsang]
    # true, không phải false. Trước ngày `batDau` thì mục này cố ý trả về rỗng;
    # để false thì tối nay admin nhận một tin chỉ có mỗi dòng tiêu đề "Học sáng"
    # và không có gì bên dưới. Mọi trường hợp CÓ chuyện để nói — kể cả lỗi đọc
    # giáo trình — đều tự đánh dấu là đáng gửi, nên im ở đây là im đúng chỗ.
    quietIfEmpty: true
    # Không dùng LLM (RP1) — đọc thẳng registry/giaotrinh-ngoaingu.yaml, nên
    # tin này tốn 0đ mỗi sáng và vẫn tới kể cả khi hết hạn mức Claude.
    #
    # GỬI TRỌN BÀI chứ không gửi mỗi cái link: admin học lúc vừa mở cửa, tay
    # còn bận. Bắt mở trình duyệt là thêm một bậc thềm, và bậc thềm nào cũng là
    # chỗ để bỏ dở — kế hoạch tiếng Anh cũ nằm ở 0/6 suốt ba tháng đúng vì thế.
    # Link để ở cuối, cho lúc muốn NGHE phát âm (thứ duy nhất Telegram không chở
    # được).

  - scheduleId: goalNudge
    displayName: "Bước sắp tới hạn"
    enabled: true
    at: "08:00"
    days: [2]                    # TRẢ VỀ sáng thứ Hai ngày 19/08.
    kind: companyCall
    companyId: goalCompany
    capability: dueSteps         # read — cron nhắc, admin mới đánh dấu (S3)
    input: { trongNgay: 7, chiKhiCo: true }
    quietIfEmpty: true
    # Sáng 19/08 từng đổi thành mỗi ngày để nhắc bài ngoại ngữ. Nay `hocSang`
    # gửi trọn bài rồi, nên để nó chạy hằng ngày nữa là hai tin cùng nói về một
    # kế hoạch — đúng kiểu lặp lại làm admin ngừng đọc thông báo. Trả về tuần,
    # và để nó lo đúng việc cũ: nhắc bước sắp tới hạn của MỌI kế hoạch.

  - scheduleId: weeklyPlan
    displayName: "Tiến độ 100 video"
    enabled: true
    at: "08:00"
    days: [2]                    # sáng thứ Hai
    kind: companyCall
    companyId: planCompany
    capability: progressReport   # riskTier phải là read, dispatcher tự kiểm (S3)
    input: {}
    quietIfEmpty: false
