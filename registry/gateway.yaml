# Cấu hình adminGateway.
#
# KHÔNG chứa secret và KHÔNG chứa định danh cá nhân (F2).
# Token bot  → ops/.env (chmod 600, .gitignore chặn).
# adminChatId → biến môi trường COMPANYSPEC_ADMIN_CHAT_ID, hoặc file
#               registry/gateway.local.yaml (đã bị .gitignore chặn).
#
# Bỏ trống có chủ đích: hệ phải từ chối chạy khi chưa được cấu hình, thay vì
# chạy với một giá trị đoán được.

adminChatId: null

sessionPolicy:
  windowMinutes: 30              # R3 — trong cửa sổ này thì nối thread gần nhất
  maxTurnsPerSession: 25         # trần phiên — quá thì mở phiên mới kèm tóm tắt

approval:
  requestTtlHours: 12            # G11 — yêu cầu duyệt sống lâu, admin còn ngủ
  tokenTtlMinutes: 10            # G11 — token sau khi bấm nút thì sống ngắn, dùng 1 lần

whitelist:
  defaultDays: 90                # G7 — quyền không bao giờ vĩnh viễn
  defaultMaxPerDay: 20           # G8 — có trần dùng mỗi ngày

# NGƯỠNG HẠN MỨC ĐÃ BỎ ngày 2026-08-16 (admin quyết).
#
# Trước đây ở đây có bốn con số warn/stop cho cửa sổ 5 tiếng và tuần, và
# dispatcher dùng chúng để khoá việc GHI. Bỏ vì hai lẽ:
#
#   · Con số không bám thực tế. Đo 2026-08-16: `claude -p --output-format json`
#     trả về tokens và total_cost_usd nhưng KHÔNG có trường nào nói hạn mức còn
#     lại; CLI cũng không có lệnh con `usage`. Nên mọi ngưỡng ở đây chỉ là quy
#     đổi từ bảng giá token — hệ tự bịa, không liên quan trần thật của gói Pro.
#
#   · Nó chặn NGƯỢC. Cầu dao chỉ chặn `write` (ghi chi tiêu, ví, việc vặt) vốn
#     tốn $0 LLM vì company là code cứng; trong khi thứ thật sự đốt hạn mức đều
#     là `read` (nghienCuu $3,50 · auditSite $2,00) và không hề bị chặn.
#
# Thay bằng: đợi Anthropic tự nói hết hạn mức rồi báo admin ngay lúc đó —
# lib/quotaSignal.py. Chi phí vẫn được đo và hiện trong báo cáo sáng, nhưng
# chỉ để BIẾT, không dùng để chặn.
