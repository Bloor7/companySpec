# Company giữ hồ sơ về admin — thứ CEO cần biết để hiểu ý nhanh hơn qua thời gian.
#
# C4 — ranh giới là công việc "nhớ giùm admin những điều về chính admin". Khác
# journalCompany (nhật ký là chuyện ĐÃ XẢY RA, tra lại khi cần) ở chỗ hồ sơ là
# những điều ĐANG ĐÚNG, và CEO mang theo chúng ở mọi lượt mà không phải tra.
#
# Hai loại, phân biệt bằng `hetHan`:
#   · không hạn — điều luôn đúng: cách admin gọi tên đồ vật, thói quen, bối cảnh sống.
#   · có hạn    — điều đúng trong một quãng: đang ốm, đang ở xa, đang gánh một
#                 việc lớn. Quá ngày thì tự rụng khỏi prompt (xem `hetHan` dưới).
#
# Điểm đặc biệt: sản phẩm của company này được NẠP THẲNG vào system prompt của
# CEO ở mỗi lượt (gateway đọc PROFILE.md). Nên nó nguy hiểm hơn mọi company khác:
# một dòng sai ở đây ảnh hưởng mọi câu trả lời sau đó, chứ không chỉ một bản ghi.
# Vì thế KHÔNG năng lực nào ở đây được whitelist — lần nào cũng phải admin đồng ý.

companyId: profileCompany
displayName: "Phòng hồ sơ"
version: 0.1.0

runtime: code
entrypoint: ./src/main.py
runtimeReason: "Đọc/ghi một danh sách câu ngắn. Không cần hiểu ngôn ngữ tự nhiên."

# Nguồn sự thật là FILE TEXT, không phải sqlite: admin phải mở ra đọc được bằng
# mắt và sửa được bằng tay. Thứ quyết định cách CEO hiểu về admin mà lại nằm
# trong một file nhị phân thì không ai kiểm được nó đang nói gì về mình.
dataStore: ./PROFILE.md
secrets: []
env:     []
canBeCalledBy: [ceo]
canCall: []
owner: admin

capabilities:
  - name: listFacts
    description: "Đọc hồ sơ: những điều CEO đang nhớ về admin."
    riskTier: read
    maxDurationSec: 10
    inputSchema:
      type: object
      additionalProperties: false
      properties:
        nhom:
          enum: [xưng hô, thói quen, từ vựng riêng, bối cảnh, sở thích, trạng thái]
    outputSchema:
      type: object
      additionalProperties: false
      required: [facts, count]
      properties:
        count: { type: integer }
        facts: { type: array }

  - name: rememberFact
    description: >
      Ghi thêm một điều về admin vào hồ sơ. Mỗi lần một câu ngắn, tự nó đứng
      được — câu này sẽ xuất hiện trong mọi cuộc trò chuyện sau đó.
    riskTier: write
    maxDurationSec: 10
    # CỐ Ý KHÔNG CÓ whitelistScope (G12). Mỗi dòng thêm vào đây đổi cách CEO
    # hiểu admin ở MỌI lượt sau, nên "luôn cho phép ghi nhớ" là câu không ai
    # thật sự muốn nói. Admin phải đọc từng câu trước khi nó có hiệu lực.
    inputSchema:
      type: object
      additionalProperties: false
      required: [nhom, noiDung]
      properties:
        nhom:
          enum: [xưng hô, thói quen, từ vựng riêng, bối cảnh, sở thích, trạng thái]
        # Ngắn có chủ ý: hồ sơ nằm trong system prompt của mọi lượt. Dài dòng
        # thì vừa tốn hạn mức mỗi lần nhắn, vừa loãng những điều thật sự quan trọng.
        noiDung: { type: string, minLength: 3, maxLength: 200 }
        # HẠN DÙNG — thứ chia hồ sơ làm hai loại.
        #
        # Bỏ trống = điều LUÔN ĐÚNG (thói quen, cách xưng hô, bối cảnh sống).
        # Có ngày  = điều đúng trong MỘT QUÃNG rồi thôi. Quá ngày đó thì company
        #            không đưa nó cho CEO nữa; nó tự rụng, không ai phải nhớ đi xoá.
        #
        # VÌ SAO PHẢI CÓ: trước đây hồ sơ chỉ nhận "điều luôn đúng", nên mọi thứ
        # đúng-trong-một-quãng đều bị vứt — CEO không có chỗ cất, sang phiên sau
        # thì trắng. Nhưng cất mà KHÔNG có ngày hết còn tệ hơn: hồ sơ nạp vào MỌI
        # lượt và không bao giờ tự hết hạn, nên một câu cũ ba tháng vẫn được đọc
        # như đang đúng. Ngày hết hạn là thứ giữ cho "nhớ" khỏi thành "nhớ nhầm"
        # — cùng lý lẽ với TOM_TAT_GIO ở gateway: thà trắng còn hơn sai.
        #
        # Nhóm "trạng thái" BẮT BUỘC có ngày, company từ chối nếu thiếu. Nhóm
        # khác thì tuỳ: một bối cảnh cũng có thể là tạm thời.
        hetHan:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: "Ngày cuối còn đúng (YYYY-MM-DD, giờ VN, tính cả ngày đó)."
    outputSchema:
      type: object
      additionalProperties: false
      required: [factId, nhom, noiDung, tong]
      properties:
        factId:  { type: string }
        nhom:    { type: string }
        noiDung: { type: string }
        hetHan:  { type: [string, "null"] }
        tong:    { type: integer }

  - name: forgetFact
    description: >
      Xoá một điều khỏi hồ sơ. PHẢI gọi listFacts trước để lấy factId và đúng
      nội dung của dòng đó.
    riskTier: write
    maxDurationSec: 10
    inputSchema:
      type: object
      additionalProperties: false
      # D7 — noiDung để ĐỐI CHIẾU. Admin duyệt câu "quên chuyện lương mùng 1";
      # nếu factId lại trỏ dòng khác thì company từ chối.
      required: [factId, noiDung]
      properties:
        factId:  { type: string, minLength: 2, maxLength: 8 }
        noiDung: { type: string, minLength: 3, maxLength: 200 }
    outputSchema:
      type: object
      additionalProperties: false
      required: [factId, noiDung, tong]
      properties:
        factId:  { type: string }
        nhom:    { type: [string, "null"] }
        noiDung: { type: string }
        tong:    { type: integer }
