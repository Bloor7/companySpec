# Trần tài nguyên cho MỌI tiến trình của `hop` (uid 2000) trong hộp openclaw.
#
# Cài (root, trong openclaw):
#   mkdir -p /etc/systemd/system/user-2000.slice.d
#   cp gioi-han-hop.conf /etc/systemd/system/user-2000.slice.d/50-gioi-han.conf
#   systemctl daemon-reload
#
# VÌ SAO: các distro WSL2 chung một kernel. Đo 26/09: slice của hop có
# `memory.max = max` — thợ chạy `npm install` hay một vòng test phình ra là
# ăn hết 7 GB của máy ảo, và OOM-killer của KERNEL CHUNG chọn nạn nhân không
# theo distro: có thể là poller của Ubuntu. Đúng họ với 25/09 — hộp làm chết
# hệ chính qua một thứ hai bên dùng chung (hôm ấy là cây cgroup).
#
# Đặt ở slice chứ không ở hop-tho.service: unit --user thì hop tự sửa được;
# drop-in trong /etc thì không. Trần phải nằm ngoài tầm tay kẻ bị giới hạn.
#
# Con số: máy ảo 7 GB · 12 lõi · swap 2 GB (đo 26/09). Chừa hơn nửa cho hệ chính.
#
# ⚠ MemoryMax một mình KHÔNG đủ — đã thử phá: xin 3,5 GB thì RAM bị chặn đúng
# ở 2,56 GB, nhưng 1 GB còn lại tràn sang swap và tiến trình SỐNG. Swap là
# 2 GB CHUNG cả máy ảo; hộp ăn hết swap thì OOM vẫn rơi xuống đầu Ubuntu.
# Nên phải chặn cả swap.
#
# ⚠ KHÔNG dùng MemoryHigh — cũng đã thử: vượt ngưỡng thì kernel SIẾT chứ không
# giết, tiến trình bò mãi ở ~2,5 GB, treo quá 2 phút không xong không chết.
# Với thợ chạy nền, treo tệ hơn chết: chết thì nhịp tim tắt, donDep trả việc
# về hàng; treo thì việc giữ chỗ mà không ai biết. Chết nhanh, nói rõ.

[Slice]
MemoryMax=3G
MemorySwapMax=256M
CPUQuota=400%
TasksMax=1024
