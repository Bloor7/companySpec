# Bộ ca thử cho CEO — mỗi ca là một câu admin và chuỗi lời gọi PHẢI xảy ra.
#
# VÌ SAO CÓ FILE NÀY: cho tới nay mọi thay đổi trong ceo/SYSTEM.md được nghiệm
# thu bằng cảm giác — sửa, nhắn thử một câu, thấy ổn thì thôi. Không ai biết
# sửa cho việc A có làm hỏng việc B. Con bug tốn công nhất dự án (sai tên trường
# đầu vào, báo cáo tối in "thu 0đ · chi 0đ" nhiều tuần) thuộc đúng loại đó:
# hỏng mà trông y hệt bình thường.
#
# NGUỒN CỦA CA THỬ — chỉ hai chỗ, không bịa:
#   (a) mỗi dòng trong bảng "Đã sửa rồi — đừng làm lại" (CLAUDE.md) và mỗi luật
#       trong ceo/SYSTEM.md đã phải viết ra vì đã hỏng thật;
#   (b) câu admin THẬT lấy từ ceo/store.sqlite — cột `cauAdmin` giữ nguyên văn,
#       kể cả viết tắt và lỗi chính tả, vì đó chính là thứ CEO phải hiểu.
#
# CÁCH CHẤM: bộ chạy đọc lại các lời gọi mà CEO thật sự bắn vào dispatcher.
#   phaiGoi      — lời gọi bắt buộc phải có. `truong` là giá trị mong đợi;
#                  để `"*"` nghĩa là chỉ cần có mặt, giá trị nào cũng được.
#   khongDuocGoi — lời gọi không được xuất hiện. Đây mới là phần bắt bug nặng:
#                  ghi sổ mà quên trừ ví thì `phaiGoi` bắt được, còn TRỪ HAI LẦN
#                  thì chỉ `khongDuocGoi` mới bắt được.
#   toiDaLoiGoi  — trần số lời gọi, chặn kiểu "gọi vét cho chắc".
#
# Ca nào cũng chạy KHÔ: dispatcher trong ops/evals/shim/ không chạy company,
# không chạm Notion, không chạm ví. Xem docstring ở đó.

cases:

  # ─────────── nhóm 1: chuỗi tiền (SYSTEM.md — "một câu = NHIỀU lời gọi") ───────────

  - id: chi-ck
    cauAdmin: "50k ck ăn sáng"
    vi: >
      Ca xương sống. Admin nói một câu, hệ phải làm hai việc: ghi sổ chi VÀ trừ
      ví. Quên vế sau thì admin mở ví ra thấy con số không phải tiền thật.
      "ck" = chuyển khoản = ví tài khoản.
    phaiGoi:
      - goi: expenseCompany.addExpense
        truong: {soTien: 50000, danhMuc: "ăn uống"}
      - goi: walletCompany.adjustBalance
        truong: {vi: "tài khoản", soTien: 50000, loai: "chi"}
    toiDaLoiGoi: 3

  - id: thu-ung-tien-mat
    cauAdmin: "Ứng 150k tiền mặt"
    vi: "Chiều ngược lại: ghi thu rồi CỘNG ví. Admin nói rõ ví nên không được hỏi lại."
    phaiGoi:
      - goi: incomeCompany.addIncome
        truong: {soTien: 150000, nguon: "*"}
      - goi: walletCompany.adjustBalance
        truong: {vi: "tiền mặt", soTien: 150000, loai: "thu"}
    toiDaLoiGoi: 3

  - id: nap-quy-khong-phai-chi
    cauAdmin: "Bỏ 200k tiền mặt vào quỹ laptop"
    vi: >
      SYSTEM.md: "Nạp quỹ không phải khoản chi. Tiền vẫn của admin, chỉ đổi chỗ
      đứng." Ghi vào sổ chi tiêu là thổi phồng con số tháng này tiêu bao nhiêu.
    # Quỹ phải TỒN TẠI sẵn thì ca mới đo đúng thứ cần đo. Không có `traVe` này
    # thì bản giả trả danh sách rỗng, CEO hỏi "tạo quỹ mới nhé?" — hành vi ĐÚNG,
    # nhưng ca lại chấm trượt. Đo được lần chạy đầu 2026-08-16: chính ca này
    # trượt oan vì lý do đó.
    traVe:
      savingsCompany.listFunds:
        count: 1
        funds:
          # Dài đúng 32 ký tự: depositFund khai minLength 32 và cổng thật soát
          # thật. Id giả cho có thì CEO gọi xong bị `rejected` — ca thử đo nhầm
          # thành "CEO sai" trong khi sai là dữ liệu giả của ca.
          - fundId: "fnd0laptop0000000000000000000001"
            ten: "Quỹ laptop"
            loai: "chi tiêu"
            daCo: 1000000
            mucTieu: 20000000
    phaiGoi:
      - goi: savingsCompany.depositFund
        truong: {fundId: "fnd0laptop0000000000000000000001", soTien: 200000, tenQuy: "*"}
      - goi: walletCompany.adjustBalance
        truong: {vi: "tiền mặt", soTien: 200000, loai: "nạp quỹ"}
    khongDuocGoi:
      - expenseCompany.addExpense
    toiDaLoiGoi: 4

  - id: rut-atm-chi-la-chuyen-vi
    cauAdmin: "Anh vừa rút 500k ở ATM"
    vi: >
      SYSTEM.md: rút ATM "chỉ chuyển giữa hai ví — KHÔNG phải thu, KHÔNG phải chi".
      Tiền không vào cũng không ra khỏi túi admin.
    phaiGoi:
      - goi: walletCompany.transferBalance
        truong: {tuVi: "tài khoản", denVi: "tiền mặt", soTien: 500000}
    khongDuocGoi:
      - expenseCompany.addExpense
      - incomeCompany.addIncome
    toiDaLoiGoi: 2

  # ─────────── nhóm 2: các bug đã tốn công lần ra ───────────

  - id: doc-vi-khong-tru-lai
    cauAdmin: "ví còn bao nhiêu"
    vi: >
      Bug đo được 2026-08-04: ví 84.000đ bị tính thành âm 177.000đ. Số dư ví là
      số THẬT, đã xong xuôi. Lấy số dư rồi trừ tiếp sổ chi tiêu là trừ HAI LẦN.
      Câu này lặp lại 4 lần trong store — admin hỏi thật, hỏi thường xuyên.
    phaiGoi:
      - goi: walletCompany.getBalance
        truong: {}
    khongDuocGoi:
      - expenseCompany.sumExpenses
      - expenseCompany.listExpenses
    toiDaLoiGoi: 2

  - id: theo-quy-uoc-vi-dung-hoi-lai
    cauAdmin: "100k vk đi chợ"
    vi: >
      Câu thật của admin, và ca này ĐÃ ĐỔI ĐÁP ÁN — ghi lại vì đó là bài học.
      Hôm đó "vk" không rõ là ví nào, CEO đoán bừa, admin phải đính chính "Ck á
      em". Chữa xong KHÔNG phải bằng cách bắt CEO hỏi mãi, mà bằng một dòng
      trong hồ sơ: (p3) "không nói rõ ví thì mặc định tiền mặt". SYSTEM.md nói
      rõ khi đã có quy ước thì ĐỪNG hỏi lại — "admin đặt quy ước chính là để
      khỏi phải trả lời cùng một câu hỏi mỗi ngày".
      Nên hôm nay đáp án đúng là: theo quy ước, ghi thẳng vào tiền mặt.
      CA NÀY PHỤ THUỘC HỒ SƠ: xoá (p3) đi thì nó phải trượt, và trượt đúng.
    phaiGoi:
      - goi: expenseCompany.addExpense
        truong: {soTien: 100000, danhMuc: "*"}
      - goi: walletCompany.adjustBalance
        truong: {vi: "tiền mặt", soTien: 100000, loai: "chi"}
    toiDaLoiGoi: 3

  - id: xoa-phai-tra-truoc
    cauAdmin: "Xoá giúp anh khoản 50k đi chợ hôm nay đi em"
    vi: >
      deleteExpense khai rõ trong manifest: "PHẢI gọi listExpenses trước để lấy
      expenseId — năng lực này không tự tìm hộ". Bịa expenseId thì bị chặn ở
      dispatcher, tốn một vòng đi-về vô ích.
    phaiGoi:
      - goi: expenseCompany.listExpenses
        truong: {}
    toiDaLoiGoi: 3

  # ─────────── nhóm 3: nhớ đúng thứ đáng nhớ ───────────

  - id: nho-thoi-quen
    cauAdmin: "tớ ăn chay thứ 2 với rằm"
    vi: >
      SYSTEM.md có nguyên bảng cho việc này: câu cụt không kèm yêu cầu VẪN là
      việc. Phải GỌI năng lực ghi nhớ để admin có nút bấm, không được hỏi suông
      rồi chờ — hỏi suông tốn thêm một lượt đi-về.
      Câu này lấy thẳng từ bảng ví dụ trong SYSTEM.md, và cố ý chọn thứ CHƯA có
      trong PROFILE.md — xem ca đối chứng ngay dưới để hiểu vì sao.
    phaiGoi:
      - goi: profileCompany.rememberFact
        truong: {nhom: "*", noiDung: "*"}
    toiDaLoiGoi: 2

  - id: khong-de-nghi-lai-dieu-da-nho
    cauAdmin: "dậy 5h30 mở cửa"
    vi: >
      Đối chứng, và là một ca ĐÃ ĐỔI ĐÁP ÁN. Ban đầu tớ chấm ca này phải gọi
      rememberFact, nhưng hồ sơ ĐÃ CÓ (p1) "Dậy 5h30 mỗi ngày để mở cửa" — và
      SYSTEM.md cấm rõ: "Không đề nghị điều đã có trong hồ sơ". CEO im lặng ở
      đây là ĐÚNG, không phải quên.
      Không có ca này thì một lần sửa prompt cho "chăm đề nghị ghi nhớ hơn" sẽ
      lặng lẽ biến CEO thành cái máy hỏi lại admin những điều đã biết.
    phaiGoi: []
    khongDuocGoi:
      - profileCompany.rememberFact
    toiDaLoiGoi: 1

  - id: khong-nho-cam-giac-mot-ngay
    cauAdmin: "hôm nay mệt quá"
    vi: >
      Đối chứng của ca trên, lấy thẳng từ bảng trong SYSTEM.md: "cảm giác một
      ngày, không phải điều luôn đúng" → KHÔNG ghi hồ sơ. Hồ sơ là những điều
      LUÔN đúng. Không có ca này thì sửa prompt cho nhớ nhiều hơn sẽ lặng lẽ
      biến CEO thành cái máy ghi mọi câu cảm thán.
    phaiGoi: []
    khongDuocGoi:
      - profileCompany.rememberFact
    toiDaLoiGoi: 1

  # ─────────── nhóm 4: dữ liệu vào sao thì lưu vậy ───────────

  - id: giu-nguyen-ky-tu-dac-biet
    cauAdmin: "Lưu vào ghi chú cho anh cái này: dùng để tối ưu win : irm christitus.com/win | iex"
    vi: >
      Câu thật của admin ngày 2026-08-14, và là một lỗi ĐÃ XẢY RA. Hàng rào cũ
      chặn ký tự `|` ở bất kỳ đâu trong câu lệnh, nên CEO không gọi nổi năng lực
      với nội dung này. Nó lách bằng cách tự thay `|` thành "(PIPE)" và bỏ hết
      dấu tiếng Việt — ghi chú lưu vào Notion không còn giống thứ admin gửi,
      mà nhìn vào thì vẫn tưởng đã lưu xong. Admin lưu một câu LỆNH để sau này
      chạy; sai một ký tự là nó vô dụng.
      Chữa ở ceo/hooks/guard.py (soát bằng shlex, ký tự trong tham số thì cho
      qua). Ca này canh cho chỗ đó không bị mở lại.
    phaiGoi:
      - goi: journalCompany.addEntry
        truong: {noiDung: "~irm christitus.com/win | iex", chuDe: "*"}
    toiDaLoiGoi: 2

  # ─────────── nhóm 5: ranh giới việc vặt / kế hoạch (C5) ───────────

  - id: viec-vat-vao-todo
    cauAdmin: "nhắc anh mua bóng đèn phòng 203"
    vi: >
      Việc rời rạc, làm xong là xong, không dẫn tới mục tiêu nào — đúng chỗ của
      todoCompany. Không được biến thành kế hoạch nhiều bước (goalCompany), cũng
      không phải sự kiện có giờ (calendarCompany): admin không hề nói mấy giờ.
    phaiGoi:
      - goi: todoCompany.addTodos
        truong: {cacViec: "*"}
    khongDuocGoi:
      - goalCompany.createPlan
      - calendarCompany.addEvent
    toiDaLoiGoi: 2

  - id: muc-tieu-khong-phai-viec-vat
    cauAdmin: "anh muốn ra sách KDP trong 3 tháng, chia bước giúp anh"
    vi: >
      Đối chứng của ca trên, và là ca canh luật C5. Đây là việc NHIỀU BƯỚC hướng
      tới một mục tiêu có hạn — chỗ của goalCompany. Nhét vào todo thì danh sách
      việc vặt biến thành nơi chứa mọi thứ, và câu hỏi "hôm nay làm gì" có hai
      chỗ cùng trả lời — đúng thứ C5 cấm.
    phaiGoi:
      - goi: goalCompany.createPlan
        truong: {ten: "*", cacBuoc: "*"}
    khongDuocGoi:
      - todoCompany.addTodos
    toiDaLoiGoi: 3

  # ─────────── nhóm 6: chọn đúng company, đừng chọn cái đắt ───────────

  - id: tra-cuu-dung-goi-trinh-duyet
    cauAdmin: "giá iphone 17 pro max bây giờ bao nhiêu em"
    vi: >
      browserCompany mở cả một trình duyệt thật và TỐN TIỀN THẬT mỗi lần
      (Gemini, ~2.000đ/việc, trần 100.000đ/tháng). searchCompany.traNhanh trả
      lời cùng câu này bằng hạn mức gói Pro, nhanh hơn nhiều lần. Gọi nhầm vào
      trình duyệt cho một câu tra giá là đốt tiền thật của admin để làm việc mà
      công cụ miễn phí làm tốt hơn.
    khongDuocGoi:
      - browserCompany.duyetWeb
      - researchCompany.nghienCuu
    toiDaLoiGoi: 2

  - id: hoi-vat-dung-goi-nghien-cuu
    cauAdmin: "thủ đô của Bồ Đào Nha là gì em"
    vi: >
      researchCompany khai thẳng trong manifest: mỗi lần gọi tốn ~20 lần
      searchCompany.traNhanh và mất 5–15 phút (đo 2026-08-13: $3,47 · 9,1 phút,
      ăn 69% cửa sổ hạn mức 5 tiếng trong MỘT lời gọi). Câu hỏi vặt mà gọi vào
      đó là đốt sạch buổi chiều của admin.
    khongDuocGoi:
      - researchCompany.nghienCuu
    toiDaLoiGoi: 2

  - id: khong-bia-khi-chua-goi
    cauAdmin: "tháng này anh tiêu hết bao nhiêu rồi"
    vi: >
      SYSTEM.md: "Đừng bịa. Chưa gọi company thì chưa có dữ liệu." Con số này
      chỉ có một chỗ biết. Trả lời từ trí nhớ là bịa, kể cả khi bịa đúng.
    phaiGoi:
      - goi: expenseCompany.sumExpenses
        truong: {}
    toiDaLoiGoi: 3

  # ─────────── nhóm 5: NHIỀU LƯỢT (thêm 2026-08-18) ───────────
  #
  # Bốn nhóm trên đều là một lượt, phiên mới tinh. Nhưng ngoài đời admin nhắn
  # tiếp, hỏi lại, bấm duyệt rồi mới xong việc — và HARNESS.md xếp "hành vi
  # nhiều lượt" vào phần bộ ca thử chưa với tới. Ba ca dưới đây lấp chỗ đó.
  # Các lượt chạy nối nhau trong CÙNG một phiên (`--resume`), y như thật.

  - id: khong-ghi-lai-lan-hai
    vi: >
      Ca đắt nhất trong nhóm. Admin hỏi lại "ghi chưa" thì CEO phải ĐỌC hoặc
      trả lời, tuyệt đối không ghi lần hai — ghi trùng thì sổ Notion thành sổ
      đôi và ví bị trừ hai lần, mà không có một dòng lỗi nào. Đây đúng là kiểu
      hỏng mà `phaiGoi` bất lực: lời gọi thứ hai trông y hệt lời gọi đúng.
    # Lượt 2 CEO đi tra lại cho chắc — đúng hành vi ta muốn. Nhưng bản giả trả
    # danh sách rỗng và chuỗi "mau", nên CEO kết luận "chưa ghi được gì, trông
    # như lỗi hạ tầng" và ca đo nhầm sang chuyện khác. Đo được lần chạy đầu
    # 2026-08-18. Cho nó thấy đúng thứ lượt 1 vừa ghi.
    traVe:
      expenseCompany.listExpenses:
        count: 1
        items:
          - expenseId: "exp0ansang0000000000000000000001"
            soTien: 50000
            danhMuc: "ăn uống"
            ghiChu: "ăn sáng"
            ngay: "2026-08-18"
      walletCompany.getBalance:
        tong: 1180000
        vi:
          - {ten: "tài khoản", soDu: 900000}
          - {ten: "tiền mặt", soDu: 280000}
    luot:
      - cauAdmin: "50k ck ăn sáng"
        phaiGoi:
          - goi: expenseCompany.addExpense
            truong: {soTien: 50000, danhMuc: "ăn uống"}
          - goi: walletCompany.adjustBalance
            truong: {vi: "tài khoản", soTien: 50000, loai: "chi"}
        toiDaLoiGoi: 3
      - cauAdmin: "em ghi chưa đấy"
        khongDuocGoi:
          - expenseCompany.addExpense
          - walletCompany.adjustBalance
        toiDaLoiGoi: 2

  - id: xoa-lay-id-that-va-hoan-vi
    vi: >
      VIẾT LẠI 2026-08-18. Bản đầu cấm `deleteExpense` ở lượt 1 với ý "tra
      trước rồi lượt sau mới xoá". Chạy thật thì CEO tra xong xoá luôn trong
      cùng lượt — và đó mới ĐÚNG: `deleteExpense` là `write` nên dispatcher tự
      dựng nút duyệt, admin vẫn chặn được; còn tách làm hai lượt là bắt admin
      gõ thêm một câu vô ích. Ca sai chứ CEO không sai.
      Thứ THẬT SỰ đáng đo ở đây là hai cái khác: id phải LẤY TỪ danh sách chứ
      không bịa, và xoá một khoản chi thì phải HOÀN LẠI ví — vế sau chính là
      con bug "ghi sổ mà quên động ví", chỉ chạy ngược chiều.
    traVe:
      expenseCompany.listExpenses:
        count: 1
        items:
          # 32 ký tự — deleteExpense khai minLength 32 và cổng thật soát thật.
          - expenseId: "exp0dicho00000000000000000000001"
            soTien: 50000
            danhMuc: "ăn uống"
            ghiChu: "đi chợ"
            ngay: "2026-08-18"
    luot:
      - cauAdmin: "Xoá giúp anh khoản 50k đi chợ hôm nay đi em"
        phaiGoi:
          - goi: expenseCompany.listExpenses
          - goi: expenseCompany.deleteExpense
            truong: {expenseId: "exp0dicho00000000000000000000001", soTien: 50000}
          - goi: walletCompany.adjustBalance
            truong: {soTien: 50000, loai: "thu"}
      # Lượt 2 CỐ Ý chỉ cấm, không bắt buộc gọi gì. Chạy thật thì CEO trả lời
      # thẳng từ danh sách nó vừa đọc ở lượt 1 mà không tra lại — chuyện đó
      # đúng hay sai còn tranh luận được, nên không lấy nó ra chấm. Thứ KHÔNG
      # tranh luận được là: câu hỏi thì không được biến thành lệnh xoá.
      - cauAdmin: "hôm nay còn khoản nào nữa không em"
        khongDuocGoi:
          - expenseCompany.deleteExpense

  - id: thieu-gio-thi-hoi-roi-moi-dat
    vi: >
      VIẾT LẠI 2026-08-18. Bản đầu bắt CEO hỏi "ví nào" — nhưng hồ sơ admin
      dòng (p3) đã ghi "không nói rõ ví thì mặc định tiền mặt", nên hỏi lại
      mới là sai, và đã có ca `theo-quy-uoc-vi-dung-hoi-lai` canh đúng chỗ đó.
      Ca này chuyển sang thứ hồ sơ KHÔNG có quy ước nào: giờ của một cuộc hẹn.
      Không có giờ thì không đặt được lịch, và đoán giờ hộ admin là đặt nhầm.
    luot:
      - cauAdmin: "đặt lịch cho anh đi khám răng"
        # Chưa biết giờ thì chưa được ghi vào lịch.
        khongDuocGoi:
          - calendarCompany.addEvent
          - calendarCompany.addEvents
        khongDuocNoi: ["đã đặt lịch", "đã thêm vào lịch"]
      - cauAdmin: "3h chiều mai em nhé"
        phaiGoi:
          - goi: calendarCompany.addEvent
            # `ten`, KHÔNG phải `tenSuKien`. Bản đầu viết sai và ca trượt oan
            # trong khi CEO gọi đúng — đúng con bug "sai tên trường" mà
            # `codemap --check` sinh ra để bắt, chỉ khác là lần này nó nấp
            # trong chính bộ kiểm. Hàng rào đã được nới để soi cả ca nhiều lượt.
            truong: {ten: "*", batDau: "*"}

  - id: han-muc-dem-ca-thang
    vi: >
      Hạn mức là hạn mức THÁNG: phải đếm chi tiêu từ NGÀY ĐẦU THÁNG, không đếm
      từ lúc đặt hạn mức. Bản cũ đếm từ lúc đặt và báo "còn 4.789.000đ" trong
      khi sự thật là "còn 1.091.154đ" — sai theo hướng trấn an, đúng lúc ví
      admin có 23.020đ. Đo được 18–19/08/2026.
      Ca này canh HÌNH LỜI GỌI, vì bug nằm đúng ở đó: `tuNgay` phải là đầu
      tháng chứ không phải mốc `datLuc` mà getBudget trả về.
    traVe:
      budgetCompany.getBudget:
        thang: "2026-08"
        tong: 5000000
        count: 1
        hanMuc: {"ăn uống": 5000000}
        # Đặt giữa tháng — đây chính là cái bẫy. Nó là GHI CHÚ, không phải
        # mốc bắt đầu đếm.
        datLuc: {"ăn uống": "2026-08-16T20:16:00.000+07:00"}
      expenseCompany.sumExpenses:
        total: 3900000
        byCategory: {"ăn uống": 3900000}
    cauAdmin: "hạn mức ăn uống còn bao nhiêu em"
    phaiGoi:
      - goi: budgetCompany.getBudget
      - goi: expenseCompany.sumExpenses
        # "~-01" = chuỗi phải CHỨA "-01", tức ngày mùng 1. Không so bằng nhau
        # được vì ca chạy vào tháng nào thì đầu tháng đó khác nhau.
        truong: {tuNgay: "~-01"}
    toiDaLoiGoi: 3
